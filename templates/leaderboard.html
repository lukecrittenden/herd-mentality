{% extends 'base.html' %}
{% block content %}
<h1>Leaderboard</h1>
<div class="centered-div">
    <div class="alternative-box">
        {% for player in leaderboard %}
            <p>{{ loop.index }}{% if loop.index == 1 %}st{% elif loop.index == 2 %}nd{% elif loop.index == 3 %}rd{% else %}th{% endif %}: {{ player[1] }} - {{ player[0] }}</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
